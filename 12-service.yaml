kind: Service
apiVersion: v1
metadata:
  name: nginx
  namespace: backend
spec:
  selector:
    project: expense
    component: backend
    environment: dev
    version: "1.0"
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
kind: Pod
apiVersion: v1
metadata:
  name: nginx
  namespace: backend
  labels:
    project: expense
    component: backend
    environment: dev
    version: "1.0"
spec:
  containers:
    - name: nginx
      image: nginx